packages:
    - .
allowBuilds:
    lefthook: true
    esbuild: false
    cpu-features: false
    eslint-plugin-n8n-nodes-base: true
    isolated-vm: false
    ssh2: false
    unrs-resolver: false
minimumReleaseAgeExclude:
