name: Publish Package (npm + GitHub Packages)

# n8n requires community nodes submitted for verification to be published via
# GitHub Actions with an npm provenance statement (mandatory from 1 May 2026).
# `npm publish --provenance` below, run from this workflow, satisfies that.

on:
  release:
    types:
      - published
  # Manual run: publishes only to GitHub Packages (e.g. to backfill a version
  # that already exists on npmjs). Builds the current default-branch checkout.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to GitHub Packages only (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token for npm provenance / Trusted Publishing
      contents: read
      packages: write # publish to npm.pkg.github.com with GITHUB_TOKEN
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Lint (n8n node/credential rules)
        run: pnpm run lint:n8n

      - name: Type check
        run: pnpm run typecheck

      - name: Update package.json version
        run: |
          VERSION="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Publish to npm
        if: github.event_name == 'release'
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npmjs, skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          GH=https://npm.pkg.github.com
          printf "@artus-engineering:registry=%s\n//npm.pkg.github.com/:_authToken=%s\n" "$GH" "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/gh.npmrc"
          if npm view "$NAME@$VERSION" version --registry="$GH" --userconfig "$RUNNER_TEMP/gh.npmrc" >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on GitHub Packages, skipping"
          else
            npm publish --registry="$GH" --userconfig "$RUNNER_TEMP/gh.npmrc" --access public
          fi
