name: Publish Package (npm)

# n8n requires community nodes submitted for verification to be published via
# GitHub Actions with an npm provenance statement (mandatory from 1 May 2026).
# `npm publish --provenance` below, run from this workflow, satisfies that.

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # mint the OIDC token for npm provenance / Trusted Publishing
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: artus-engineering/.github/actions/setup-pnpm@feb73e3bc8a16c61582dd578627ba5d6dc07e2ca

      - uses: actions/setup-node@v7
        with:
          check-latest: false
          package-manager-cache: false
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Lint (n8n node/credential rules)
        run: pnpm run lint:n8n

      - name: Type check
        run: pnpm run typecheck

      - name: Update package.json version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$RELEASE_VERSION"
          VERSION="${VERSION#v}"
          NUMBER='(0|[1-9][0-9]*)'
          IDENTIFIER="($NUMBER|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          SEMVER="$NUMBER\.$NUMBER\.$NUMBER(-$IDENTIFIER(\.$IDENTIFIER)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?"
          if [[ ! "$VERSION" =~ ^$SEMVER$ ]]; then
            echo "::error::Release tag must be a semantic version, for example v1.0.0"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Verify npm contents and n8n community package
        run: pnpm run check:package

      - name: Publish to npm
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG_ARGS=()
          if [[ "$RELEASE_PRERELEASE" == "true" || "${VERSION%%+*}" == *-* ]]; then
            TAG_ARGS=(--tag=next)
          fi
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npmjs, skipping"
          else
            npm publish --provenance --access public --registry=https://registry.npmjs.org "${TAG_ARGS[@]}"
          fi
